[package]
name = "repository-visual-analysis"
version = "0.1.0"
description = "Desktop app that draws repositories as a graph of nodes and wires"
edition = "2021"
license = "MIT"

[lib]
name = "rva_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
rayon = "1"
tree-sitter = "0.25"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.24"
notify = "8"

[dev-dependencies]
tempfile = "3"
