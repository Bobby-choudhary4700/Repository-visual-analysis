<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Repository Visual Analysis</title>
    <!-- Shown from the first frame until the app has drawn itself, so the window is never
         blank while the scripts load. Inline, since nothing else has loaded yet. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1120;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(ellipse at 50% 42%, #14213b 0%, #0b1120 58%, #070b15 100%);
        color: #e2e8f0;
        font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        letter-spacing: 0.01em;
        transition: opacity 0.25s ease;
      }
      #splash.light {
        background: radial-gradient(ellipse at 50% 42%, #e6f0fb 0%, #f4f6fa 60%);
        color: #0f172a;
      }
      #splash.done {
        opacity: 0;
        pointer-events: none;
      }
      #splash canvas {
        width: 168px;
        height: 168px;
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading">
      <canvas aria-hidden="true"></canvas>
      <div>Repository Visual Analysis</div>
    </div>
    <script>
      // The loading logo: a slowly turning 3D cluster of files wired to each other. Nodes
      // join and leave over time, so the cluster grows and shrinks while the app loads.
      // Plain canvas, since nothing else has loaded yet. main.tsx removes #splash, which
      // stops the loop.
      (() => {
        const splash = document.getElementById("splash");
        let light = false;
        try {
          // Match the saved theme from the first frame (see src/theme.ts).
          const theme = localStorage.getItem("rva.theme");
          light = theme === "light" || (theme === "system" && matchMedia("(prefers-color-scheme: light)").matches);
        } catch {}
        if (light) splash.classList.add("light");

        const canvas = splash.querySelector("canvas");
        const ctx = canvas.getContext("2d");
        const size = 168;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = size * dpr;
        canvas.height = size * dpr;
        ctx.scale(dpr, dpr);

        const COLORS = ["#38bdf8", "#818cf8", "#f472b6", "#34d399", "#fbbf24"];
        const WIRE = light ? "15, 23, 42" : "148, 197, 255";
        const FADE = 0.7; // seconds to grow in or shrink away
        const hub = { x: 0, y: 0, z: 0, r: 1.5, color: "#38bdf8", born: -FADE, dying: Infinity };
        let nodes = [hub];
        let lastSpawn = 0;
        let colorAt = 0;

        const ease = (k) => (k <= 0 ? 0 : k >= 1 ? 1 : k * k * (3 - 2 * k));
        const life = (n, t) => ease((t - n.born) / FADE) * (1 - ease((t - n.dying) / FADE));

        function spawn(t) {
          // A point in a shell around the hub, so nodes don't pile up in the middle.
          const u = Math.random() * 2 - 1;
          const a = Math.random() * Math.PI * 2;
          const d = 0.45 + Math.random() * 0.55;
          const s = Math.sqrt(1 - u * u);
          nodes.push({
            x: Math.cos(a) * s * d,
            y: u * d,
            z: Math.sin(a) * s * d,
            r: 0.8 + Math.random() * 0.5,
            color: COLORS[colorAt++ % COLORS.length],
            born: t,
            dying: Infinity,
          });
        }

        function step(t) {
          // How many nodes the cluster wants right now: between 4 and 22, rising and falling.
          const want = Math.round(13 + 9 * Math.sin(t * 0.55 - 1.2));
          const alive = nodes.filter((n) => n.dying === Infinity);
          if (alive.length < want && t - lastSpawn > 0.12) {
            spawn(t);
            lastSpawn = t;
          } else if (alive.length > want && t - lastSpawn > 0.12) {
            const leaving = alive.find((n) => n !== hub);
            if (leaving) leaving.dying = t;
            lastSpawn = t;
          }
          nodes = nodes.filter((n) => t - n.dying < FADE);
        }

        function draw(t) {
          const rot = t * 0.6;
          const tilt = 0.45 + Math.sin(t * 0.3) * 0.15;
          const cy = Math.cos(rot), sy = Math.sin(rot), cx = Math.cos(tilt), sx = Math.sin(tilt);
          const half = size / 2;
          const pts = nodes.map((n) => {
            const x1 = n.x * cy - n.z * sy;
            const z1 = n.x * sy + n.z * cy;
            const y2 = n.y * cx - z1 * sx;
            const z2 = n.y * sx + z1 * cx;
            const p = 2.6 / (2.6 + z2); // perspective
            return { n, x: half + x1 * p * 58, y: half + y2 * p * 58, z: z2, p, a: life(n, t) };
          });

          ctx.clearRect(0, 0, size, size);

          // Each node wires to its two nearest neighbours.
          const pairs = new Set();
          for (let i = 0; i < nodes.length; i++) {
            const a = nodes[i];
            const near = [];
            for (let j = 0; j < nodes.length; j++) {
              if (i === j) continue;
              const b = nodes[j];
              near.push([(a.x - b.x) ** 2 + (a.y - b.y) ** 2 + (a.z - b.z) ** 2, j]);
            }
            near.sort((m, k) => m[0] - k[0]);
            for (const [, j] of near.slice(0, 2)) pairs.add(i < j ? i * 64 + j : j * 64 + i);
          }
          ctx.lineWidth = 1.3;
          for (const key of pairs) {
            const pa = pts[Math.floor(key / 64)], pb = pts[key % 64];
            const depth = 0.55 + 0.45 * (1 - (pa.z + pb.z + 2) / 4);
            const alpha = Math.min(pa.a, pb.a) * depth * (light ? 0.45 : 0.6);
            if (alpha <= 0.01) continue;
            ctx.strokeStyle = `rgba(${WIRE}, ${alpha})`;
            ctx.beginPath();
            ctx.moveTo(pa.x, pa.y);
            ctx.lineTo(pb.x, pb.y);
            ctx.stroke();
          }

          // Far nodes first, so near ones sit on top.
          pts.sort((m, k) => k.z - m.z);
          for (const p of pts) {
            if (p.a <= 0.01) continue;
            const r = p.n.r * 4.8 * p.p * (0.4 + 0.6 * p.a);
            ctx.globalAlpha = p.a * (0.5 + 0.5 * (1 - (p.z + 1) / 2));
            ctx.shadowColor = p.n.color;
            ctx.shadowBlur = light ? 4 : 12;
            ctx.fillStyle = p.n.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
            ctx.fill();
            // A small highlight makes each node read as a ball.
            ctx.shadowBlur = 0;
            ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
            ctx.beginPath();
            ctx.arc(p.x - r * 0.3, p.y - r * 0.3, r * 0.35, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
        }

        const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reduced) {
          for (let i = 0; i < 10; i++) spawn(-FADE);
          draw(1);
          return;
        }
        // Start with a small cluster already in place, so the first frames aren't empty.
        for (let i = 0; i < 7; i++) spawn(-FADE + i * 0.08);
        const start = performance.now();
        function frame(now) {
          if (!splash.isConnected) return;
          const t = (now - start) / 1000;
          step(t);
          draw(t);
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
