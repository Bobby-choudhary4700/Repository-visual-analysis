<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Repository Visual Analysis</title>
    <!-- Shown from the first frame until the app has drawn itself, so the window is never
         blank while the scripts load. Inline, since nothing else has loaded yet. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1120;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(ellipse at 50% 42%, #14213b 0%, #0b1120 58%, #070b15 100%);
        color: #e2e8f0;
        font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        letter-spacing: 0.01em;
        transition: opacity 0.25s ease;
      }
      #splash.light {
        background: radial-gradient(ellipse at 50% 42%, #e6f0fb 0%, #f4f6fa 60%);
        color: #0f172a;
      }
      #splash.done {
        opacity: 0;
        pointer-events: none;
      }
      #splash canvas {
        width: 168px;
        height: 168px;
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading">
      <canvas aria-hidden="true"></canvas>
      <div>Repository Visual Analysis</div>
    </div>
    <script src="/node-cluster.js"></script>
    <script>
      // The start-up screen's logo (public/node-cluster.js). main.tsx removes #splash,
      // which stops it.
      (() => {
        const splash = document.getElementById("splash");
        let light = false;
        try {
          // Match the saved theme from the first frame (see src/theme.ts).
          const theme = localStorage.getItem("rva.theme");
          light = theme === "light" || (theme === "system" && matchMedia("(prefers-color-scheme: light)").matches);
        } catch {}
        if (light) splash.classList.add("light");
        window.rvaNodeCluster(splash.querySelector("canvas"), { size: 168, light });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
